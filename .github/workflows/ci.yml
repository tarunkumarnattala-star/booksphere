name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Public placeholders only. Real values live in Vercel; the build must
      # succeed without secrets so pull requests from any state can be checked.
      NEXT_PUBLIC_APP_NAME: BookSphere
      NEXT_PUBLIC_APP_URL: https://booksphere-iota.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_key_for_ci_builds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run audit:content
      - run: npm run build
